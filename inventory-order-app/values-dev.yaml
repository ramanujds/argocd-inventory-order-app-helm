# Overlay on values.yaml — a light dev footprint. Use with
# `helm.valueFiles: [values-dev.yaml]` (see ../application-dev.yaml).
# Only the differences from values.yaml live here.

# no MySQL: drops the Secrets/PVC/Deployment/Service and flips inventory-service
# to the `dev` Spring profile (in-memory H2, schema.sql + data.sql on every boot)
mysql:
  enabled: false

inventoryService:
  # H2 state is per-pod, so more than one replica would give inconsistent data:
  # no HPA, exactly one pod
  autoscaling:
    enabled: false
  replicaCount: 1
  service:
    # internal only; reach it with `kubectl port-forward` when needed
    type: ClusterIP

orderService:
  replicaCount: 1
  service:
    # differs from values.yaml (30083) so dev can run beside the default app
    nodePort: 30085
