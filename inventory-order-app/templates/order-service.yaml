# Sync wave 2: last — it calls inventory-service, so wait for wave 1 to be Healthy.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-deployment
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: {{ .Values.orderService.replicaCount }}
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service-container
          image: "{{ .Values.orderService.image.repository }}:{{ .Values.orderService.image.tag }}"
          ports:
            - containerPort: 8080
          env:
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service"
          resources:
            {{- toYaml .Values.orderService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: {{ .Values.orderService.service.type }}
  selector:
    app: order-service
  ports:
    - port: {{ .Values.orderService.service.port }}
      targetPort: 8080
      {{- if eq .Values.orderService.service.type "NodePort" }}
      nodePort: {{ .Values.orderService.service.nodePort }}
      {{- end }}
