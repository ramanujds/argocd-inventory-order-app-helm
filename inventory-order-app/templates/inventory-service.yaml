# Sync wave 1: starts only after wave 0 (MySQL) is Healthy.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service-deployment
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  {{- if not .Values.inventoryService.autoscaling.enabled }}
  replicas: {{ .Values.inventoryService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service-container
          image: "{{ .Values.inventoryService.image.repository }}:{{ .Values.inventoryService.image.tag }}"
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- if .Values.mysql.enabled }}
            - name: MYSQL_HOST
              value: mysql-service
            - name: MYSQL_PORT
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: MYSQL_PORT
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: MYSQL_DB
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            {{- end }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ ternary "prod" "dev" .Values.mysql.enabled | quote }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.inventoryService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  type: {{ .Values.inventoryService.service.type }}
  selector:
    app: inventory-service
  ports:
    - port: {{ .Values.inventoryService.service.port }}
      targetPort: 8080
      {{- if eq .Values.inventoryService.service.type "NodePort" }}
      nodePort: {{ .Values.inventoryService.service.nodePort }}
      {{- end }}
{{- if .Values.inventoryService.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-service-hpa
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-service-deployment
  minReplicas: {{ .Values.inventoryService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.inventoryService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.inventoryService.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.inventoryService.autoscaling.targetMemoryUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down
    scaleUp:
      stabilizationWindowSeconds: 0
{{- end }}
